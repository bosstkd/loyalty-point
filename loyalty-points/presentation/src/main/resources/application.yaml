spring:
  application:
    name: loyalty-points
  datasource:
    url: jdbc:h2:mem:loyaltydb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      # Le schéma est géré par Liquibase : Hibernate se contente de vérifier la cohérence des entités.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
